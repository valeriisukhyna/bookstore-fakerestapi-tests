name: Run Automation Tests

on:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Run tests
        run: mvn clean test -B
        continue-on-error: true

      - name: Generate Allure Report
        run: mvn allure:report -pl api-tests

      - name: Deploy Allure Report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./api-tests/target/allure-report

      - name: Write Allure Report URL to Job Summary
        run: |
          echo "## Allure Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[Click here to view Allure Report](https://valeriisukhyna.github.io/bookstore-fakerestapi-tests/)" >> $GITHUB_STEP_SUMMARY